<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avengers Character Search</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header>
    <img src = "avengers.jpg" alt = "Avengers Logo" id = "logo">
    <h1> Avengers Search</h1>
  </header>
  <main>
    <label for="query">Search by Full Name or Alias</label>
    <div class = "row"> 
    <input type="text" id="query" placeholder="e.g. Tony Stark or Ironman">
    <button id="search">Search</button>
    </div>
    <h2>Results</h2>
    <div id="result"></div>
  </main>
</body>
</html>
